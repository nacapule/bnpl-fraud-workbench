# Every directional sentence in the README and the operating review, with the
# paired result and the test behind each comparison it makes
# (report/claims.py). A claim fails when its sentence leaves the rendered
# document, a clause makes more than one comparison, the sentence names a
# policy, metric, family or capacity level that no check covering it tests
# (names in report/lint.yaml), or a check stops holding.
#
# - id: short-name
#   document: README.md                       # rendered document path
#   sentence: "The hybrid policy earned more than the incumbent rules and approve-all."
#   checks:                                   # each comparative word inside a clause
#     - clause: "The hybrid policy earned more than the incumbent rules"
#       test: sign                            # sign | interval | mcnemar
#       direction: positive                   # positive | negative |
#                                             # no_detected_difference | equivalent
#       key: evaluate.net_contribution.vs_incumbent_rules.baseline.base.hybrid
#     - clause: "and approve-all"
#       test: sign
#       direction: positive
#       key: evaluate.net_contribution.vs_approve_all.baseline.base.hybrid
#       # keys: [only_first.key, only_second.key]   # mcnemar instead of key
#       # alpha: 0.05                         # optional
#       # margin: 50000                       # equivalent only, in the metric's unit
#   # context: ["which ranks the queue with gradient boosting"]   # asides: named,
#   #                                         # not compared
claims: []
