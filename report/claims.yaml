# The directional claims of the published documents (report/claims.py). A
# template places a claim with {{ claim:<id> }}; its sentence is written from
# the record below and the results, with the evidence, and the render fails
# when the results no longer support it.
#
# claims:
#   - id: hybrid-net-vs-rules                 # lower-case letters, digits, - and _
#     policy: hybrid                          # what is compared ...
#     reference: incumbent_rules              # ... against which reference
#     metric: net_contribution
#     test: sign                              # sign | interval | mcnemar
#     direction: positive                     # positive | negative |
#                                             # no_detected_difference | equivalent
#     # family: acquisition_surge             # optional; the default below otherwise
#     # capacity: high                        # optional
#     # margin: 50000                         # equivalent only, in the metric's unit
#     # alpha: 0.05                           # optional
#     # key: evaluate.net_contribution...     # optional: another result key
#     # keys: [<...>.only_policy, <...>.only_reference]   # mcnemar instead of key
claims:
  # Screening pays at all: today's rules against approving every order.
  - id: rules-cash-vs-approve-all
    policy: incumbent_rules
    reference: approve_all
    metric: net_contribution
    test: sign
    direction: positive
  # The hybrid policy, the other challenger that clears the bar in the primary cell.
  - id: hybrid-loss-vs-rules
    policy: hybrid
    reference: incumbent_rules
    metric: loss_of_gmv
    test: sign
    direction: negative
  - id: hybrid-declined-vs-rules
    policy: hybrid
    reference: incumbent_rules
    metric: legitimate_declined_per_10k
    test: sign
    direction: no_detected_difference
  # Why logistic regression is not eligible in the primary cell.
  - id: logistic-declined-vs-rules
    policy: logistic
    reference: incumbent_rules
    metric: legitimate_declined_per_10k
    test: sign
    direction: positive
  # The acquisition surge, the one cell where the answer changes.
  - id: surge-boosting-declines
    policy: boosting
    reference: incumbent_rules
    metric: legitimate_declined_per_10k
    family: acquisition_surge
    test: sign
    direction: positive

# How sentences name things. A metric's more and less read "<policy> <more>
# <reference>"; its noun names it in no-difference and equivalence sentences;
# its format prints its differences (report/formats.py). A rate or share is
# worded as one ("a larger share of"), never as a count.
wording:
  policies:
    approve_all: "approve-all"
    incumbent_rules: "the incumbent rules"
    tree_depth3: "the depth-3 tree"
    logistic: "the logistic regression"
    boosting: "the gradient-boosting policy"
    hybrid: "the hybrid policy"
    expected_loss: "the expected-loss policy"
  metrics:
    net_contribution:
      more: "kept more net cash than"
      less: "kept less net cash than"
      noun: "net cash"
      format: "usd"
    loss_of_gmv:
      more: "lost a larger share of GMV to fraud and abuse than"
      less: "lost a smaller share of GMV to fraud and abuse than"
      noun: "loss as a share of GMV"
      format: "bps"
    legitimate_held_per_10k:
      more: "held a larger share of legitimate orders than"
      less: "held a smaller share of legitimate orders than"
      noun: "legitimate orders held per 10,000 legitimate orders"
      format: "per_10k"
    legitimate_declined_per_10k:
      more: "declined a larger share of legitimate orders than"
      less: "declined a smaller share of legitimate orders than"
      noun: "legitimate orders declined per 10,000 legitimate orders"
      format: "per_10k"
    review_minutes_used_share:
      more: "used a larger share of review minutes than"
      less: "used a smaller share of review minutes than"
      noun: "share of review minutes used"
      format: "pp"
    decided_after_shipping:
      more: "decided more orders after they shipped than"
      less: "decided fewer orders after they shipped than"
      noun: "orders decided after shipping"
      format: "count"
  families:
    baseline: "the baseline world"
    acquisition_surge: "the acquisition surge"
    fraud_mix_shift: "the fraud-mix shift"
    lag_half: "the world where orders ship in half the time"
    lag_double: "the world where orders take twice as long to ship"
  capacities:  # a capacity level, the redesigned layout, or a variant of the base replay
    low: "low review capacity"
    base: "base review capacity"
    high: "high review capacity"
    redesigned_layout: "the redesigned shift layout"
    base_frozen_history: "base review capacity, with every policy seeing the history of approving every order"
    base_perfect_reviewer: "base review capacity, with a reviewer who always decides correctly"
    base_weak_verification: "base review capacity, with weaker verification checks"
  defaults:
    family: "baseline"
    capacity: "base"
  # How generated tables print identifiers (the label format of report/render.py);
  # an identifier not listed prints as its words, underscores as spaces.
  labels:
    # policies
    approve_all: "approve-all"
    incumbent_rules: "incumbent rules"
    tree_depth3: "depth-3 tree"
    logistic: "logistic regression"
    boosting: "gradient boosting"
    hybrid: "hybrid"
    expected_loss: "expected loss"
    # world families
    acquisition_surge: "acquisition surge"
    fraud_mix_shift: "fraud-mix shift"
    lag_half: "shipping time halved"
    lag_double: "shipping time doubled"
    # operating cells and replay variants
    primary: "primary cell"
    low: "low allotment"
    base: "base allotment"
    high: "high allotment"
    redesigned_layout: "evening layout"
    base_weak_verification: "weak verification"
    base_frozen_history: "approve-all history"
    base_perfect_reviewer: "perfect reviewer"
    ltv_5_usd: "lifetime-value proxy, low"
    ltv_45_usd: "lifetime-value proxy, high"
    # what an operating cell varies
    family: "world family"
    allotment: "allotment"
    layout: "shift layout"
    verification: "verification rates"
    ltv: "lifetime-value proxy"
    # the recommendation rule's outcomes, reasons and criteria
    recommend: "a challenger is recommended"
    incumbent_stays: "the incumbent stays"
    not_assessed: "not assessed"
    holds: "holds"
    a_different_policy_cleared_the_bar: "a different policy cleared the bar"
    the_primary_winner_fails_a_guardrail: "the primary cell's choice fails a guardrail"
    no_challenger_cleared_the_bar: "no challenger cleared the bar"
    lost_mean: "mean lost customers"
    lost_any_seed: "lost customers on a seed"
    held_mean: "mean held customers"
    held_any_seed: "held customers on a seed"
    service_p0: "P0 service"
    service_p1: "P1 service"
    service_p2: "P2 service"
    service_p3: "P3 service"
    # adjudicated label bases (and orders not yet labelled)
    account_takeover: "account takeover"
    third_party_fraud: "third-party fraud"
    never_pay: "never-pay"
    promo_abuse: "promotion abuse"
    inr_abuse: "item-not-received abuse"
    merchant_bustout: "merchant bust-out"
    credit_loss: "credit loss"
    no_finding: "no finding"
    unknown: "not yet labelled"
    # where a review decided
    before_shipping: "before shipping"
    after_shipping: "after shipping"
    # latent patterns (the diagnostic confusion matrix)
    legitimate: "legitimate"
    P-ATO: "account takeover"
    P-STOLEN: "stolen card"
    P-SYNTH: "synthetic ring"
    P-NEVERPAY: "never-pay"
    P-PROMO: "promotion farm"
    P-INR-ABUSE: "item-not-received abuse"
    P-MERCH: "merchant bust-out customer"
