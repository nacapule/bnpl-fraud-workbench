# Configuration of report/lint.py.

# Published documents: each needs a template under report/templates/.
documents:
  - README.md
  - reports/operating-review.md
  - reports/appendix-*.md
  - cases/*.md

# Hand-written documents not yet rewritten as templates. This list only shrinks.
not_yet_templated:
  - README.md
  - cases/CASE-01-account-takeover.md
  - cases/CASE-02-card-testing-stolen-card.md
  - cases/CASE-03-synthetic-ring-bustout.md
  - cases/CASE-04-neverpay-vs-hardship.md
  - cases/CASE-05-traveler-cleared.md

# Phrases with digits that are names, not results.
allowed_phrases:
  - pay-in-4

# Documents whose comparative sentences must each be a listed claim.
directional:
  - README.md
  - reports/operating-review.md

directional_words:
  [more, less, fewer, higher, lower, better, worse, beats, beat, outperforms,
   outperformed, exceeds, exceeded, reduces, reduced, increases, increased,
   improves, improved, cheaper, costlier, larger, smaller, most, least, best, worst]

# Comparative sentences that state no result (exact sentence text).
allowed_sentences: []

# Names that tie a claim's clauses to its checks (report/claims.py): a name
# inside a check's clause must be a segment of that check's key (vs_<name>
# counts), and every name in a claim's sentence must fall inside the clause
# of a check whose key includes it. Keys are the result-key segments.
names:
  approve_all: [approve-all, approve all, approving everything]
  incumbent_rules: [incumbent rules, incumbent]
  tree_depth3: [depth-3 tree, decision tree, shallow tree]
  logistic: [logistic regression, logistic]
  boosting: [gradient boosting, boosting]
  hybrid: [hybrid]
  expected_loss: [expected-loss, expected loss]
  baseline: [baseline family, baseline world]
  acquisition_surge: [acquisition surge, surge]
  fraud_mix_shift: [fraud-mix shift, fraud mix shift, mix shift]
  low: [low capacity, low staffing]
  base: [base capacity, base staffing]
  high: [high capacity, high staffing]
  redesigned_layout: [redesigned layout, redesigned shift layout, evening layout]
