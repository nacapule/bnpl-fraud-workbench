# Configuration of report/lint.py.

# Published documents: each needs a template under report/templates/.
documents:
  - "README.md"
  - "reports/operating-review.md"
  - "reports/appendix-*.md"
  - "cases/*.md"

# Hand-written documents not yet rewritten as templates. This list only shrinks.
not_yet_templated:
  - "README.md"

# Phrases with digits that are names, not results.
allowed_phrases:
  - "pay-in-4"
  - "depth-3"
  - "Depth-3"
  - "per 1,000"
  - "per 10,000"
  - "90th percentile"

# Documents whose templates may state a comparison only through a claim,
# {{ claim:<id> }} (report/claims.yaml).
directional:
  - "README.md"
  - "reports/operating-review.md"

# Comparative words: in a directional template's own text, each is a finding.
comparatives: ["more", "less", "fewer", "higher", "lower", "larger", "smaller", "better",
               "worse", "best", "worst", "most", "least", "beats", "beat", "beating",
               "outperforms", "outperformed", "outperforming", "underperforms",
               "underperformed", "exceeds", "exceeded", "exceeding", "surpasses",
               "surpassed", "trails", "trailed", "lags", "lagged", "improves", "improved",
               "improving", "reduces", "reduced", "reducing", "increases", "increased",
               "increasing", "cheaper", "costlier", "outearned", "dominates", "dominated"]

# Sentences that compare without stating a result, such as how a mechanism works
# ("A lower threshold holds more orders for review."), as written in the template.
allowed_sentences: []
