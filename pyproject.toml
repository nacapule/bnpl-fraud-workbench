[project]
name = "bnpl-fraud-workbench"
version = "0.1.0"
description = "End-to-end BNPL fraud operation in miniature: simulator, MySQL investigation layer, rules engine, queue/SLA simulation, ML detection, Claude-powered triage with a measured eval harness. All data synthetic."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
api = ["anthropic>=0.40"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["simulator", "rules", "queue_sim", "model", "llm", "vendor"]
