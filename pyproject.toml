[project]
name = "bnpl-fraud-workbench"
version = "0.2.0"
description = "How a small BNPL fraud team should spend limited review capacity: rules, machine-learning and hybrid policies compared on a synthetic pay-in-4 world with late-arriving evidence, a shipping deadline and the cost of turning away good customers."
requires-python = ">=3.11"
license = {text = "MIT"}
# Ranges for installing; requirements.lock pins the versions results are produced with.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "scipy>=1.11"]  # scipy: an independent check in the tests

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["core", "simulator", "rules", "queue_sim", "model", "llm", "report"]
py-modules = ["pipeline"]
