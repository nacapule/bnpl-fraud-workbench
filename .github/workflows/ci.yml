name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONDONTWRITEBYTECODE: "1"
  BNPL_DB_HOST: 127.0.0.1
  BNPL_DB_PORT: "3306"

jobs:
  checks:
    # Lint, every unit and fixture test (MySQL included), the documents
    # against the committed results, and the archived LLM benchmark replayed
    # offline from its stored responses (no model calls, no keys).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: bnpl
          MYSQL_USER: fraud
          MYSQL_PASSWORD: fraudpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufraud -pfraudpw"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the locked environment
        run: make venv
      - name: Lint
        run: make lint
      - name: Tests, MySQL required
        run: make test-mysql
      - name: Documents and figures match the results; claims hold; no typed numbers
        run: make docs-check
      - name: Archived LLM benchmark replayed offline
        run: make llm-history

  small-world:
    # One small world through every stage: the run must complete (a result
    # from every stage and a summary whose versions agree), the world must pass
    # the contract validator (chronology included) and load into the MySQL
    # schema. The run writes only to runs/ci, never to the committed results.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: bnpl
          MYSQL_USER: fraud
          MYSQL_PASSWORD: fraudpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufraud -pfraudpw"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the locked environment
        run: make venv
      - name: Small world, every stage
        run: make ci-world
      - name: The run is complete and left the repository unchanged
        run: |
          test -f runs/ci/results/summary.json
          test -z "$(git status --porcelain)"
