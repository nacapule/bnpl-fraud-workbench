name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline-scaled:
    # Smoke-runs every layer end-to-end at 5% scale in a scratch copy so the
    # committed reports and README stay untouched.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: bnpl
          MYSQL_USER: fraud
          MYSQL_PASSWORD: fraudpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufraud -pfraudpw"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check simulator db rules queue_sim model llm vendor analysis tests
      - name: Copy tree to scratch
        run: |
          mkdir -p /tmp/scaled
          cp -a . /tmp/scaled/
      - name: Generate scaled world + load
        working-directory: /tmp/scaled
        env:
          SIM_SCALE: "0.05"
        run: |
          .venv/bin/python -m simulator.generate
          .venv/bin/python db/load.py
      - name: Rules engine + tuning (scaled)
        working-directory: /tmp/scaled
        run: |
          .venv/bin/python -m rules.engine
          .venv/bin/python -m rules.tuning
      - name: Model + queue reports (scaled)
        working-directory: /tmp/scaled
        run: |
          .venv/bin/python -m model.train
          .venv/bin/python -m model.evaluate
          .venv/bin/python -m queue_sim.simulate
      - name: Staffing frontier + uncertainty (scaled)
        working-directory: /tmp/scaled
        run: |
          .venv/bin/python -m queue_sim.sweep
          .venv/bin/python -m analysis.uncertainty

  tests-full:
    # Regenerates the full-scale world (deterministic, seed 416), loads it, and
    # runs the complete test suite plus the offline LLM evaluation against the
    # committed reports and frozen eval artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: bnpl
          MYSQL_USER: fraud
          MYSQL_PASSWORD: fraudpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufraud -pfraudpw"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"
      - name: Generate full-scale world
        run: .venv/bin/python -m simulator.generate
      - name: Load + rules (full scale)
        run: |
          .venv/bin/python db/load.py
          .venv/bin/python -m rules.engine
      - name: Tests
        run: .venv/bin/python -m pytest tests/ -q
      - name: Case selection + LLM eval (offline, committed cache — no keys)
        run: |
          .venv/bin/python -m llm.eval.select_cases
          .venv/bin/python -m llm.eval.harness --offline --no-consistency
