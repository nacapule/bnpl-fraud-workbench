name: regenerate

# Manual only. The full regeneration (every final-seed world, every stage, the
# results and the documents) takes about 6-8 hours on an 8-core machine, longer
# than a hosted runner allows, and the committed results are produced on macOS
# arm64, so a byte comparison on a Linux runner would test the platform as much
# as the code. It is therefore run locally from a clean clone:
#
#   make venv && make final && git status --porcelain   # must print nothing
#
# `make final` refuses unless the protocol is frozen, the tree is clean and
# committed, and the installed packages equal requirements.lock. What fits here,
# and runs on demand: the freeze gate on a clean checkout (the frozen files match
# experiments/FREEZE.json and are committed), and the committed documents in sync
# with the committed results. The small world runs every stage on every push (ci).
on:
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the locked environment
        run: make venv
      - name: The protocol is frozen and the frozen files are unchanged
        run: .venv/bin/python -c "from core import protocol; protocol.require_freeze()"
      - name: Documents match the committed results
        run: make docs-check
