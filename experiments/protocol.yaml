# Pre-registered evaluation protocol, read and checked by core/protocol.py.
#
# Dates are fixed now, before any final world exists. Entries set to
# TO_COMPLETE_AT_FREEZE are completed in the freeze commit, before the final
# driver generates any final-seed world; the driver refuses while any remain
# (core.protocol.require_freeze). After the freeze only logged bug fixes are
# allowed, each recorded with its before/after effect.

version: 1

# Label horizon of the adjudicated label (core.world.adjudicate): an order with
# no determination known this many days after it is a known negative. Every
# gap below is at least this long.
label_horizon_days: 60

# Half-open windows [start, end) in platform-local time, contiguous and in
# order. Orders in gaps and the embargo still count as feature history.
windows:
  warm_up:      {start: 2024-01-01, end: 2024-04-01}  # history only
  fit:          {start: 2024-04-01, end: 2024-08-01}  # classifiers
  gap_1:        {start: 2024-08-01, end: 2024-10-01}  # fit labels mature
  calibration:  {start: 2024-10-01, end: 2024-11-01}  # calibrator; never used to fit classifiers
  gap_2:        {start: 2024-11-01, end: 2025-01-01}  # calibration labels mature
  validation:   {start: 2025-01-01, end: 2025-04-01}  # bands, thresholds, policy choice
  embargo:      {start: 2025-04-01, end: 2025-06-01}  # validation labels mature
  test:         {start: 2025-06-01, end: 2025-09-01}  # frozen policies evaluated
  follow_up:    {start: 2025-09-01, end: 2025-12-30}  # no new orders; outcomes mature (120 days)

# Freeze instants (00:00 on the date). Training and tuning at a freeze use only
# labels with label_known_at before it; negatives count only once known.
freezes:
  classifier: 2024-10-01   # >= fit end + horizon (2024-09-30), before calibration starts
  calibrator: 2025-01-01   # >= calibration end + horizon (2024-12-31), before validation
  policy: 2025-06-01       # >= validation end + horizon (2025-05-31), before test

# Order attempts fall in [warm_up start, test end); outcomes are observed until
# the end of follow-up. Accounts and merchants may be created before the start.
world_horizon:
  order_start: 2024-01-01
  order_end: 2025-09-01
  observed_end: 2025-12-30

# Families share every event before their start, so each seed is fitted and
# tuned once and tested on several futures. Parameters: config/world.yaml
# families. The fulfilment-lag families are sensitivities (see sensitivity).
families:
  baseline:
    starts: null
    description: the world as generated
  acquisition_surge:
    starts: 2025-06-01
    description: about twice the inflow of new legitimate customers, with a first-purchase promotion
  fraud_mix_shift:
    starts: 2025-06-01
    description: aged stolen-card sleeper accounts and a larger account-takeover share
  lag_half:
    starts: 2025-06-01
    description: every order from the test window ships in half its drawn time (a sensitivity)
  lag_double:
    starts: 2025-06-01
    description: every order from the test window ships in twice its drawn time (a sensitivity)

seeds:
  canonical: 416             # loaded into MySQL for the SQL library, packets and cases
  development: [416, 1041, 2718]   # fully open: support checks, development fits, tuning experiments
  final: [35244829, 931592514, 2066792625, 1891170948, 1671034716,
          200041300, 1260106251, 717729117, 793746605, 1629189384]
  final_drawn: >-
    2026-10-06, before any final world existed: ten draws of
    secrets.randbelow(2**31) on Python 3.14.7, redrawing any value equal to a
    development seed or an earlier draw.
  minimum_final: 8           # if the runtime budget fails, speed up the generator; never fewer

world_size:
  target_orders: 160000      # config/world.yaml volume; fraud share held near 1% of orders
  support:                   # checked on the development seeds; raise volume, never the fraud share
    min_test_orders_per_checkout_pattern: 30
    min_episodes_per_checkout_pattern: 2
    windows: [validation, test]
    report: per-pattern N and episode counts; "N=0 / not evaluated" where it applies

policies:
  approve_all: reference; every order approved
  incumbent_rules: rules with review and decline bands tuned on validation
  tree_depth3: depth-3 decision tree on at most four named features
  logistic: logistic regression
  boosting: HistGradientBoosting
  hybrid: high-specificity rules auto-decline; boosting orders the review queue
  expected_loss: calibrated probability times exposure against the cost of a false decline

# Every policy uses the same as-of context, roster, reviewer, replay and ledger.
tuning:
  where: validation window, through the replay, over attainable score cut-points
  report: best in the searched grid and the frontier; a flat result is published as flat
  # The mode queue_sim.stage.tune runs (the pipeline passes it through) and the
  # shortlist size; both equal config/policy.yaml tuning (a test checks).
  history: shortlist
  shortlist_best_k: 5
  rule:
    world: >-
      each seed's baseline world cut at the policy freeze (only labels and cash
      known before it), its validation window, the base allotment on the current
      layout
    grid: >-
      config/policy.yaml tuning.review_rates x tuning.decline_rates, each rate the
      lowest score the policy attains on validation orders whose share at or above
      it does not exceed the rate, or the highest score attained when even that
      score's share exceeds the rate (tied scores); rate 0 switches the route off,
      so "no review" and "no decline" are always points; a route the policy does
      not tune keeps its threshold (the expected-loss policy declines at zero
      expected benefit)
    screen: every grid point replayed with frozen approve-all history
    shortlist: >-
      the frozen winner, its neighbours one grid step away on each threshold, and
      the best shortlist_best_k feasible frozen points
    choice: >-
      the shortlist replayed with policy-specific history; the feasible point with
      the highest validation objective
    objective: >-
      net contribution minus the friction cost (the LTV proxy on each legitimate
      order declined or cancelled)
    feasible: >-
      the review minutes the point offers in the replay fit the minutes available
      over the window; no friction cap (config/policy.yaml
      tuning.friction_guardrail is null; the caps are in the recommendation rule)
    ties: fewer reviews, then fewer declines
    boundary: a chosen point on the highest review or decline rate searched is flagged
    infeasible: >-
      no feasible point chooses nothing; the policy is reported not evaluated on
      that seed, never replaced by a fallback
    adopted: >-
      after the development-seed check: on worlds 416, 1041 and 2718 the shortlist
      chose the same threshold pair as full policy-history tuning in all 18 policy
      and seed cells

# Capacity is analyst time allotted to the fraud queue: one analyst on every
# covered shift (coverage hours: the layout) with a fixed allotment of review
# minutes per shift; review minutes per 1,000 orders are reported as realized.
# Thresholds are tuned at the base and held fixed at low and high.
capacity:
  parameters: [coverage_hours, review_minutes_per_shift]
  base: >-
    33 minutes per shift on one analyst per covered shift: the incumbent's
    fit-window offered minutes, mean 4,593.1 over development worlds 416, 1041
    and 2718, / 0.8 / 174 shift instances = 33.0
  levels: {low: 17, base: 33, high: 50}   # minutes per shift: 0.515 and 1.515 times the base; low binds on every development world
  redesigned_layout: evening, 33 minutes on each shift (the same shift instances, so the same total minutes)
  analyst_loaded_hourly_usd: 35

metrics:   # per family, across final seeds, paired by seed; counts beside dollars
  - net_contribution_vs_approve_all
  - net_contribution_vs_incumbent
  - loss_bps_of_gmv
  - legitimate_held_per_10k_legitimate_orders
  - legitimate_declined_per_10k_legitimate_orders
  - review_minutes_used_vs_available
  - orders_decided_after_shipping
  - wall_time_to_decision_p50_p90
  - prevented_loss_by_pattern_with_n
  - share_of_loss_unreachable_at_checkout
  - capacity_level_results
  - staffing_comparison_net_of_analyst_cost
  - average_precision           # supporting row
  - brier_score                 # supporting row

# The recommendation rule is applied by core/recommendation.py in the evaluate
# stage: in the primary cell, and separately in every operating cell (the flip
# table). "Legitimate" is the adjudicated label at the end of observation (no
# fraud determination: no_finding or credit_loss); each order counts once per
# measure.
reporting:
  per_seed: differences with mean, min-max and sign count (for example 9/10)
  recommendation_rule:
    primary_cell: >-
      baseline family, base allotment, current layout, policy-specific history,
      evidence-based reviewer, standard verification
    diagnostics: >-
      the frozen-history and perfect-reviewer replays, reported beside the
      tables and never part of the rule or the flip table
    eligibility:   # means over the final seeds in the cell; per-seed range reported
      # declined at checkout, blocked, declined after review, or cancelled after an unanswered hold
      lost_legitimate_per_10000: {mean_at_most: 100, any_seed_at_most: 200}
      # held: asked to verify
      held_legitimate_per_10000: {mean_at_most: 300, any_seed_at_most: 600}
      # at every priority P0-P3, of the orders entering the review queue in the
      # test window (an order never decided is a miss); approve-all has no queue
      service_share_at_least: 0.90
      service_min_pooled_entries: 50   # fewer entries pooled over seeds: reported, not assessed
      incumbent_fails: >-
        a criterion the incumbent fails in the cell becomes "no worse than the
        incumbent", and the operating review opens by saying today's rules miss
        the target
    hurdle:
      # mean paired improvement over the incumbent, per 1,000 attempted orders
      mean_improvement_usd_per_1000_orders: 100
      # strictly positive paired differences needed, by seeds paired (zero is
      # not positive); with fewer seeds than listed, every seed
      positive_seeds: {10: 9, 9: 8, 8: 8}
    choice: >-
      among eligible challengers that clear the hurdle, the highest mean
      improvement; otherwise the incumbent stays, and the best challenger's
      mean, range and sign count are printed
    ties: [fewer lost legitimate customers, fewer review minutes, the simpler policy]
    simpler_order: [approve_all, incumbent_rules, tree_depth3, logistic, boosting, hybrid, expected_loss]
    net_contribution: >-
      ledger net after the friction cost, less the analyst allotment at
      capacity.analyst_loaded_hourly_usd per allotted hour, unused minutes
      included; a policy with no review route releases the allotment and is
      charged nothing
    flips: >-
      the full rule in every operating cell (each family, each allotment level,
      the evening layout, weak verification, each LTV proxy, each fulfilment
      lag), never combined; the flip table names the reason, and the verdict
      reads "holds in N of M cells"
    p_value: >-
      none for the selected policy: it is chosen among six challengers, and the
      sign bar is a consistency rule across simulated worlds, not a
      significance test
  friction_guardrail: >-
    the eligibility caps of the recommendation rule (lost and held legitimate
    customers); none inside tuning

# Thresholds, models and queue rules are those chosen in the primary cell on
# each seed: no sensitivity re-tunes, and sensitivities are never combined.
sensitivity:
  reviewer_verification_rates: >-
    config/policy.yaml reviewer.verification_weak, a replay variant at the base
    allotment
  # The friction cost recomputed from the same replays for all seven policies;
  # the expected-loss policy keeps the configured LTV inside its decision.
  ltv_proxy_usd: [5, 45]
  fulfilment_lag:
    # config/world.yaml fulfilment_lag_factor from the test window on; these
    # families are generated for the final seeds and replayed at the base
    # allotment only
    families: {lag_half: 0.5, lag_double: 2.0}

# The case files' alerts, chosen by a rule fixed before any final world exists
# and before any outcome was looked at. Seed 416 is a development seed, so the
# cases illustrate the replay; they are not final evidence, and the case files
# say so. Checked by core/protocol.py (keys, slots, files) and against the
# replay's main variant and configured staffing (check_case_replay).
cases:
  world: {seed: 416, family: baseline}
  replay:
    policy: incumbent_rules
    thresholds: canonical seed's validation-tuned incumbent
    capacity_level: base
    layout: current
    history: policy
    reviewer: evidence
    verification: verification   # queue_sim.stage.VARIANTS[0] (standard rates)
    window: test
  population: >-
    queue_sim.stage.routing_frame from this replay: processor-approved checkouts with band
    review or auto_decline; blocked accounts' orders excluded
  selection:
    order: >-
      ascending (SHA-256 hex digest of UTF-8 "bnpl-cases-2026-10:" + decimal order_id,
      order_id)
    slot_order: [account_takeover, never_pay, hardship, traveller, card_testing, ring]
    duplicate_rule: an order already selected for an earlier slot is skipped
    mimic_rule: exact token membership in (mimic or "").split("+")
    legitimate_rule: latent_orders.intent == legitimate and pattern_id is null
    reviewed_rule: >-
      present in review_decisions with non-null taken_up_at and decided_at; no condition
      on disposition, final decision or verification results
    tier_rule: the first non-empty tier, then its first candidate in the selection order
  slots:
    account_takeover: {predicate: "latent_orders.pattern_id == P-ATO", tiers: [reviewed_alert, checkout_alert]}
    never_pay: {predicate: "latent_orders.pattern_id == P-NEVERPAY", tiers: [reviewed_alert, checkout_alert]}
    hardship: {predicate: "legitimate_rule and mimic token hardship_default", tiers: [reviewed_alert, checkout_alert]}
    traveller: {predicate: "legitimate_rule and mimic token travel", tiers: [reviewed_alert, checkout_alert]}
    card_testing: {predicate: "latent_orders.pattern_id == P-STOLEN and processor_declines_device_24h >= 1 at checkout", tiers: [checkout_alert]}
    ring: {predicate: "latent_orders.pattern_id == P-SYNTH", tiers: [checkout_alert]}
  files:
    account_takeover: {slots: [account_takeover], length: full}
    never_pay_vs_hardship: {slots: [never_pay, hardship], primary_alert: never_pay, comparison: independently selected, each with its own facts, length: full}
    traveller: {slots: [traveller], length: full}
    card_testing: {slots: [card_testing], length: short}
    ring: {slots: [ring], length: short}
  selection_limits: >-
    latent strata may define a slot (hardship_default encodes the generator's draw of a
    natural default, stated in the case); labels, cash, later observable outcomes and
    reviewer dispositions never rank or filter candidates; latent truth is reported only as
    a separate diagnostic, never in the facts table or a prompt
  facts: >-
    reviewed slots use the saved review_decisions row of the first analyst decision
    (evidence_at = decision_at, analyst_started_at = taken_up_at, action_at = decided_at,
    recorded action = disposition); checkout slots use the replay's saved checkout context
    row for the order (ReplayResult.alert_rows; evidence_at = action_at = checkout, recorded
    action = band); later checks and final dispositions are reported separately
  later_events: >-
    from the incumbent replay's realized tables through the end of observation; the
    world's approve-all outcomes, where they differ, are labelled as such
  missing: >-
    all five files are kept; a missing slot is reported with its eligible alert and
    reviewed counts; never another seed, window, family or policy
  publication: >-
    each case records its order_id, alert_id, policy_version, selection hash, tier and
    candidate counts; titles state what happened in the replay; tested changes and negative
    results are published without replacing the case

# The final driver refuses to generate a final-seed world unless this marker
# exists, every listed file matches its recorded SHA-256, the marker and the
# files are committed unchanged, and no TO_COMPLETE_AT_FREEZE entry remains
# (core.protocol.require_freeze). The list is what decides the published
# numbers: the protocol, the configuration, the policy document, and the code
# that generates worlds, builds the context, fits, routes, reviews, replays,
# accounts, evaluates, chooses and referees, with the gate itself, the
# package versions they run with, and the archived LLM study the llm stage
# replays (every in-repository module the frozen code imports is frozen too,
# except report/, which writes sentences and figures from the results). A directory
# entry (ending in /) freezes every file under it that git does not ignore, so
# a file added there later is refused too; what later stages add (case files,
# benchmarks, templates, the methods text) lives outside these entries. The
# methods text is committed with the freeze but not frozen, so the
# documentation can be completed.
#
# A bug found after the freeze is fixed in a commit of its own that also runs
# core.protocol.log_fix: it re-records the hashes of the files the fix changed
# and appends to the marker's fixes the files, what was wrong and the fix's
# before/after effect on the results. Nothing else re-freezes: writing the
# marker again is refused once it exists.
freeze:
  marker: experiments/FREEZE.json
  files:
    - experiments/protocol.yaml
    - config/world.yaml
    - config/policy.yaml
    - policy/fraud-policy.md
    - simulator/
    - core/world.py
    - core/ledger.py
    - core/actions.py
    - core/evidence.py
    - core/asof.py
    - core/recommendation.py
    - core/stats.py
    - core/results.py
    - core/protocol.py
    - queue_sim/
    - rules/
    - model/
    - core/__init__.py
    - core/config.py
    - llm/__init__.py
    - llm/referee.py
    - llm/packet.py       # the referee reads packets through it
    - llm/eval/__init__.py
    - llm/eval/history.py # the archived study's replay, published by the llm stage
    - llm/eval/tokens.py
    - llm/eval/benchmarks/2026-08-dev/MANIFEST.json
    - llm/eval/benchmarks/2026-08-dev/original/
    - llm/eval/benchmarks/2026-08-dev/corrected/world_checks.json
    - pipeline.py
    - requirements.lock   # the final profile also refuses an installed environment that differs
