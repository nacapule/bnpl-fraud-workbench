# Memo drafter: prompt, arms, benchmark sizes and call caps. Live calls run through
# the command-line tools in llm/client.py (CODEX_CLI_BIN, CLAUDE_CLI_BIN), isolated
# from the caller's files and settings; responses are cached in each benchmark's
# directory so scores replay offline with no calls.

tasks:
  memo:
    prompt_version: memo_fp2_v2     # llm/prompts/<version>.md, followed by the policy

arms:                               # one name per model; effort is always explicit
  sol: {backend: codex, model: gpt-6.1-sol, effort: high}
  opus: {backend: claude, model: claude-opus-5-5, effort: high}

benchmark:
  development_cases: 40             # review decisions from development seeds
  development_check_cases: 25       # decisions at check completions from development seeds
  development_combined: {review: 20, check_completed: 20}  # drawn from the two above
  final_cases: 200                  # from the test windows of at least min_final_seeds
  final_axes: {review: 120, check_completed: 80}  # the final cases by decision point
  min_cases_per_check_outcome: 20   # final cases after each check outcome in the pool
  min_final_seeds: 3
  case_memos: 6                     # at most: the case files' alerts (six slots)
  max_cases_per_cluster: 2          # per account and per episode
  probe_cases: 40                   # invariance probes on final cases
  probe_kinds: [shuffled, renamed]  # context facts reordered; fresh placeholder names
  max_output_tokens: 16000          # per request, enforced by the backend where it can be
  input_overhead_tokens: 4000       # the CLI's own input beyond the prompts, at most
  context_tokens: 200000            # smallest context window of the bounded arms' models
  token_stop_margin: 1000000        # a token cap stops admitting calls this far below it

caps:                               # per arm across benchmarks, retries and checks included
  sol: {calls: 400}
  opus: {calls: 330, tokens: 10000000}
